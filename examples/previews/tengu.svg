<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 360 360" role="img" aria-labelledby="title desc" data-character="tengu" data-mood="sleepy" data-theme="neon"><title id="title">BuildBuddy: queued build</title><desc id="desc">sleepy tengu. Dreaming of the next build</desc><defs><radialGradient id="halo"><stop stop-color="#70f4e5" stop-opacity=".2"/><stop offset="1" stop-color="#70f4e5" stop-opacity="0"/></radialGradient></defs><style>
