<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 360 360" role="img" aria-labelledby="title desc" data-character="ghost" data-mood="sleepy" data-theme="neon"><title id="title">BuildBuddy: queued build</title><desc id="desc">sleepy ghost. Dreaming of the next build</desc><defs><linearGradient id="shell" x1="0" y1="0" x2="0.8" y2="1"><stop stop-color="#70f4e5"/><stop offset="1" stop-color="#297d85"/></linearGradient><radialGradient id="halo"><stop stop-color="#70f4e5" stop-opacity=".2"/><stop offset="1" stop-color="#70f4e5" stop-opacity="0"/></radialGradient></defs><style>
 .buddy{transform-origin:180px 170px;animation:float 3.2s ease-in-out infinite}
 .eyes{transform-box:fill-box;transform-origin:center;animation:blink 5.4s infinite}
 .tail{transform-origin:229px 206px;animation:tail 3.2s ease-in-out infinite}
 .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
 @keyframes bounce{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
 @keyframes shake{0%,85%,100%{transform:translateX(0)}89%,97%{transform:translateX(-2px) rotate(-1deg)}93%{transform:translateX(2px) rotate(1deg)}}
 @keyframes work{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg) translateY(-2px)}}
 @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
 @keyframes blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.12)}}
 @keyframes tail{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(8deg)}}
 @keyframes twinkle{0%,100%{opacity:.55;transform:scale(.88)}50%{opacity:1;transform:scale(1.08)}}
 @media(prefers-reduced-motion:reduce){.buddy,.eyes,.tail,.spark{animation:none!important}}
 </style><rect width="360" height="360" rx="26" fill="#140f26"/><rect x="10" y="10" width="340" height="340" rx="21" fill="#201736" stroke="#49335d"/><g font-family="ui-sans-serif,system-ui,sans-serif"><text x="28" y="39" font-size="10" font-weight="700" letter-spacing="2" fill="#c3afd9">BUILD BUDDY</text><circle cx="322" cy="35" r="4" fill="#b599d9"/><ellipse cx="180" cy="162" rx="123" ry="111" fill="url(#halo)"/><circle cx="180" cy="160" r="87" fill="none" stroke="#49335d" stroke-dasharray="2 8"/><ellipse cx="180" cy="240" rx="57" ry="8" fill="#faf5ff" opacity=".13"/><g fill="#c3afd9" font-weight="700"><text x="251" y="118" font-size="18">z</text><text x="272" y="96" font-size="12">z</text></g><g class="buddy" stroke="#faf5ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M124 166 Q103 166 107 183 Q112 191 125 183 M236 166 Q257 166 253 183 Q248 191 235 183" fill="url(#shell)"/><path d="M122 157 C122 74 238 74 238 157 L240 225 Q227 211 218 228 Q208 240 195 225 Q180 212 169 228 Q158 240 146 225 Q135 214 120 229Z" fill="url(#shell)"/><path d="M138 132 Q146 109 162 108" fill="none" stroke="#201736" stroke-width="6" opacity=".55"/><g transform="translate(180 152) scale(1.20)" stroke="#faf5ff"><ellipse cx="-33" cy="10" rx="8" ry="4" fill="#ff80c8" opacity=".65" stroke="none"/><ellipse cx="33" cy="10" rx="8" ry="4" fill="#ff80c8" opacity=".65" stroke="none"/><path d="M-30 -1 q8 10 16 0 M14 -1 q8 10 16 0" fill="none"/><ellipse cx="0" cy="17" rx="4" ry="5" fill="#faf5ff" stroke="none"/></g><path d="m166 196 q14 10 28 0" fill="none" stroke="#201736" stroke-width="2" opacity=".5"/></g><rect x="134" y="259" width="93" height="22" rx="11" fill="#b599d9" fill-opacity=".13"/><circle cx="147" cy="270" r="3" fill="#b599d9"/><text x="188" y="274" text-anchor="middle" fill="#faf5ff" font-size="10" font-weight="750" letter-spacing="1.5">QUEUED</text><text x="180" y="302" text-anchor="middle" fill="#faf5ff" font-size="13" font-weight="600">Dreaming of the next build</text><text x="180" y="337" text-anchor="middle" fill="#c3afd9" font-size="8" font-weight="600" letter-spacing="1.2">YOUR BUILD HAS FEELINGS</text></g></svg>